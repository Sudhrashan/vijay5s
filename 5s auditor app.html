<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Header Section -->

<div class="bg-primary p-4 rounded-xl mb-4 shadow-sm w-[120px] h-[120px] flex items-center justify-center">
<img alt="VIJAY Logo" class="w-full h-auto object-contain drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAA5xH0pgHbxdZnE0fAks9wdVavQ3H5iYU5RZQU1JJvNvP9U1ofQHKP7EX-0Fl9n7w6_0SBnB--oHoaZ9n9X3m9Whwei9X3-qKlT4FZsPGOX2NeZOhfmVBP4kn261YgpENQdUKUi-15ybSpOuuMYfpllHaJS6kXUD-mno4ZTJUekckNLzmFdD1xl6WF749E9bVxScrdwM4nh6mWsOGD2IWbT-0owwWqyts9F0UMVhnqTQhmM44lvA1HGhNtW5sx9YP3nA2BbkG_oP2r7Mc"/>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-1">5S Audit System</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Vijay Milk — Plant VD01</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest w-full rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-4 flex flex-col gap-4 border border-surface-container-low">
<form class="flex flex-col gap-4">
<!-- Employee ID Field -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="employee-id">Employee ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">badge</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="employee-id" name="employee-id" placeholder="Enter ID" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="Enter password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<span class="font-label-md text-label-md text-on-surface-variant">Remember me</span>
</label>
</div>
<!-- Login Button -->
<button class="w-full h-14 bg-primary hover:bg-primary-container active:bg-primary text-on-primary font-label-md text-label-md rounded-xl transition-colors shadow-sm mt-4 flex items-center justify-center gap-2" type="submit">
<span class="">Login to Audit System</span>
<span class="material-symbols-outlined">login</span>
</button>
<a class="font-label-md text-label-md text-primary text-center w-full mt-2 hover:underline" href="#">Forgot Password?</a>
