<body class="bg-[#F4F7FA] text-on-surface font-body-md h-screen flex flex-col justify-center items-center p-page-margin">
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Header Section -->
<div class="flex flex-col items-center mb-section-gap w-full text-center">
<div class="bg-[#073B63] p-4 rounded-xl mb-4 shadow-sm w-[120px] h-[120px] flex items-center justify-center">
<img alt="VIJAY Logo" class="w-full h-auto object-contain drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAA5xH0pgHbxdZnE0fAks9wdVavQ3H5iYU5RZQU1JJvNvP9U1ofQHKP7EX-0Fl9n7w6_0SBnB--oHoaZ9n9X3m9Whwei9X3-qKlT4FZsPGOX2NeZOhfmVBP4kn261YgpENQdUKUi-15ybSpOuuMYfpllHaJS6kXUD-mno4ZTJUekckNLzmFdD1xl6WF749E9bVxScrdwM4nh6mWsOGD2IWbT-0owwWqyts9F0UMVhnqTQhmM44lvA1HGhNtW5sx9YP3nA2BbkG_oP2r7Mc">
</div>
<h1 class="font-screen-title text-screen-title text-[#073B63] mb-1">5S Audit System</h1>
<p class="font-body-md text-body-md text-[#64748B]">Vijay Milk — Plant VD01</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest w-full rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-card-padding flex flex-col gap-stack-gap border border-surface-container-low">
<form class="flex flex-col gap-stack-gap">
<!-- Employee ID Field -->
<div class="flex flex-col gap-1">
<label class="font-section-label text-section-label text-on-surface-variant" for="employee-id">Employee ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">badge</span>
</div>
<input class="w-full h-touch-target-min pl-12 pr-4 bg-surface-container-lowest border border-[#D1D5DB] rounded-lg focus:border-[#0B5FA5] focus:ring-1 focus:ring-[#0B5FA5] outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="employee-id" name="employee-id" placeholder="Enter ID" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="font-section-label text-section-label text-on-surface-variant" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full h-touch-target-min pl-12 pr-12 bg-surface-container-lowest border border-[#D1D5DB] rounded-lg focus:border-[#0B5FA5] focus:ring-1 focus:ring-[#0B5FA5] outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="Enter password" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 rounded border-[#D1D5DB] text-[#0B5FA5] focus:ring-[#0B5FA5]" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
</label>
</div>
<!-- Login Button -->
<button class="w-full h-touch-target-min bg-[#0B5FA5] hover:bg-[#094d86] active:bg-[#073b63] text-on-primary font-button-label text-button-label rounded-xl transition-colors shadow-sm mt-4 flex items-center justify-center gap-2" type="submit">
<span class="">Login to Audit System</span>
<span class="material-symbols-outlined">login</span>
</button>
<a class="font-body-sm text-body-sm text-[#0B5FA5] text-center w-full mt-2 hover:underline" href="#">Forgot Password?</a>
</form>
</div>
<!-- Footer -->
<footer class="mt-section-gap text-center w-full">
<p class="font-body-sm text-body-sm text-[#94A3B8]">v1.0 • Powered by Vijay IT</p>
</footer>
</main>


</body></html>
