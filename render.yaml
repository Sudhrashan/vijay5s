# Render.com Blueprint for the Vijay 5S Console pilot.
#
# This declares both web services and the free Postgres database. Service names below
# are fixed on purpose: Render's public URL is always https://<service-name>.onrender.com,
# so the frontend's API_UPSTREAM and the backend's CORS_ORIGINS can both be filled in
# correctly BEFORE the first deploy, with no "deploy once, fix the URL, redeploy" round trip.
#
# Render does NOT read backend/railway.json or frontend/railway.json - those files are
# left in place for reference only and are ignored by Render.
#
# Secrets (marked sync: false below) are never stored in this file. Render will prompt
# for them once in the dashboard the first time you deploy this blueprint.

databases:
  - name: vijay5s-db
    plan: free
    databaseName: vijay5s
    user: vijay5s

services:
  # ---- Backend: FastAPI (api) --------------------------------------------------------
  - type: web
    name: vijay5s-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: vijay5s-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://vijay5s-web.onrender.com
      - key: SEED_ON_START
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ADMIN_EMP_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_USER_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: 5sphotos

  # ---- Frontend: nginx reverse proxy (web) -------------------------------------------
  - type: web
    name: vijay5s-web
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Render has no private internal DNS between two free web services (unlike Railway's
      # *.railway.internal), so nginx proxies straight to the api service's public HTTPS
      # hostname. onrender.com hostnames are stable, so 15-dns-resolver.sh's re-resolve-on-
      # every-request behaviour is unnecessary here but harmless to keep.
      - key: API_UPSTREAM
        value: vijay5s-api.onrender.com:443
      - key: API_HOST
        value: vijay5s-api.onrender.com
      - key: API_SCHEME
        value: https
